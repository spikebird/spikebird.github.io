<!doctype html>
<html>
  <head>
    <title>FlexcardJC3B</title>

    <style>
      body {
        background: linear-gradient(magenta);
        font-family: Arial;
        text-align: center;
      }

      h1 {
        color: white;
      }

      .container {
        width: 700px;
        margin: auto;
        background: lightgray;
        border: 4px solid black;
        padding: 15px;
      }

      .row {
        border: 3px dashed black;
        margin: 10px 0;
        padding: 20px;
        display: flex;
      }

      .box {
        width: 70px;
        height: 70px;
        background: lime;
        border: 3px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
      }

      /* row alignments */

      .row1 {
        justify-content: space-between;
      }

      .row2 {
        justify-content: center;
        gap: 20px;
      }

      .row3 {
        justify-content: space-between;
      }

      .row4 {
        justify-content: space-around;
      }

      .row5 {
        justify-content: flex-end;
        gap: 15px;
      }

      .row6 {
        background: rgb(255, 0, 136);
        justify-content: space-between;
      }

      .row7 {
        justify-content: space-between;
      }
    </style>
  </head>

  <body>
    <h1>FlexcardJC3B</h1>

    <div class="container">
      <div class="row row1">
        <div class="box">001</div>
        <div class="box">002</div>
      </div>

      <div class="row row2">
        <div class="box">003</div>
        <div class="box">004</div>
        <div class="box">005</div>
      </div>

      <div class="row row3">
        <div class="box">006</div>
        <div class="box">007</div>
        <div class="box">008</div>
        <div class="box">009</div>
      </div>

      <div class="row row4">
        <div class="box">010</div>
        <div class="box">011</div>
        <div class="box">012</div>
      </div>

      <div class="row row5">
        <div class="box">013</div>
        <div class="box">014</div>
      </div>

      <div class="row row6">
        <div class="box">019</div>
        <div class="box">018</div>
        <div class="box">017</div>
        <div class="box">016</div>
        <div class="box">015</div>
      </div>

      <div class="row row7">
        <div class="box">020</div>
        <div class="box">021</div>
      </div>
    </div>
  </body>
</html>
