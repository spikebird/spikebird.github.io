<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>It's a Dog's Life</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        background-color: #355c7d;
        padding: 1rem;
        color: white;
      }

      .hero {
        height: 90vh;
        background:
          linear-gradient(to right, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.2)),
          url("images/dog_on_couch.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
      }

      .hero h1 {
        font-size: 3rem;
      }

      .hero p {
        margin: 1rem 0;
      }

      .hero button {
        padding: 0.75rem 1.5rem;
        background-color: #e74c3c;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 1rem;
      }
    </style>
  </head>

  <body>
    <header>
      <h2>It's a Dog's Life</h2>
    </header>

    <section class="hero">
      <div>
        <h1>Welcome to It's a Dog's Life</h1>
        <p>We love dogs more than humans</p>
        <button>Get Started</button>
      </div>
    </section>
  </body>
</html>
