<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Align Items Live Demo</title>

    <style>
      #flexparent {
        width: 600px;
        height: 600px;
        background-color: crimson;
        margin: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
      }

      .flexchildren {
        width: 50px;
        height: 50px;
        background-color: lightblue;
        border: 1px solid black;
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <h1>Flexbox Align Items Live Demo</h1>

    <div id="flexparent">
      <!-- div.flexchildren{child}*4-->
      <div class="flexchildren">Child 1</div>
      <div class="flexchildren">Child 2</div>
      <div class="flexchildren">Child 3</div>
      <div class="flexchildren">Child 4</div>
    </div>
  </body>
</html>
